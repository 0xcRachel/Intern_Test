version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: exam_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - exam_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: exam_php
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mongo
    networks:
      - exam_network

  mysql:
    image: mysql:8.0
    container_name: exam_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: exam_db
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: exam_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - exam_network

  mongo:
    image: mongo:7.0
    container_name: exam_mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: exam_logs
    volumes:
      - mongo_data:/data/db
    networks:
      - exam_network

volumes:
  mysql_data:
  mongo_data:

networks:
  exam_network:
    driver: bridge
