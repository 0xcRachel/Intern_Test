services:
  nginx:
    image: nginx:1.25-alpine
    container_name: exam_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - exam_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: exam_php
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: exam_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: exam_logs
      MONGO_ENABLED: "true"
      MONGO_USERNAME: mongo_user
      MONGO_PASSWORD: mongo_pass
      RUN_SEED: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - exam_network

  mysql:
    image: mysql:8.0
    container_name: exam_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: exam_db
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: exam_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - exam_network

  mongo:
    image: mongo:7.0
    container_name: exam_mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: exam_logs
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u mongo_user -p mongo_pass --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - exam_network

volumes:
  mysql_data:
  mongo_data:

networks:
  exam_network:
    driver: bridge
