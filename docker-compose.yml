services:
  nginx:
    image: nginx:1.25-alpine
    container_name: exam_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - exam_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ZALO_URL: ${VITE_ZALO_URL:-https://zalo.me/}
        VITE_MESSENGER_URL: ${VITE_MESSENGER_URL:-https://m.me/}
    container_name: exam_frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      VITE_API_BASE_URL: /api
    expose:
      - "3000"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - exam_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: exam_php
    environment:
      APP_URL: http://localhost:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/auth/github/callback}
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-exam_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: exam_logs
      MONGO_ENABLED: "true"
      MONGO_USERNAME: mongo_user
      MONGO_PASSWORD: mongo_pass
      RUN_SEED: "true"
      # Keep Laravel's optimization caches inside the container. The project
      # directory is bind-mounted, so writing config/route caches there would
      # leak Docker environment values into host-side test runs.
      APP_CONFIG_CACHE: /tmp/laravel/config.php
      APP_ROUTES_CACHE: /tmp/laravel/routes-v7.php
      APP_EVENTS_CACHE: /tmp/laravel/events.php
      APP_PACKAGES_CACHE: /tmp/laravel/packages.php
      APP_SERVICES_CACHE: /tmp/laravel/services.php
    volumes:
      - .:/var/www/html
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - exam_network

  mongo:
    image: mongo:7.0
    container_name: exam_mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: exam_logs
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u mongo_user -p mongo_pass --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - exam_network

volumes:
  mongo_data:

networks:
  exam_network:
    driver: bridge
